name: Deploy docs

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-docs
    cancel-in-progress: true

permissions:
    contents: read
    deployments: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: docs
            url: https://exhaustive-ui.e-xiste.com

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Build packages and docs
              env:
                  NODE_ENV: production
              run: |
                  pnpm run build:packages

            # The docs app is built with SSR enabled; Cloudflare Pages serves the browser bundle
            # and falls back to index.html for client-side routes.
            # wrangler-action installs wrangler with `pnpm add` at the workspace root, which pnpm
            # refuses in a monorepo, so call wrangler through npx instead.
            - name: Deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  npx --yes wrangler@4 pages deploy apps/docs/dist/docs/browser --project-name=exhaustive-ui --branch=main --commit-dirty=true
