name: Deploy docs

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-docs
    cancel-in-progress: true

permissions:
    contents: read
    deployments: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: docs
            url: https://exhaustive-ui.com

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Build packages and docs
              env:
                  NODE_ENV: production
              run: |
                  pnpm run build:packages

            # The docs app is built with SSR enabled; Cloudflare Pages serves the browser bundle
            # and falls back to index.html for client-side routes.
            # wrangler-action installs wrangler with `pnpm add` at the workspace root, which pnpm
            # refuses in a monorepo, so call wrangler through npx instead.
            - name: Deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  npx --yes wrangler@4 pages deploy apps/docs/dist/docs/browser --project-name=exhaustive-ui --branch=main --commit-dirty=true

            - name: Write the Markdown docs
              run: |
                  node scripts/docs-markdown.mjs docs-markdown

            - name: Upload the Markdown docs
              uses: actions/upload-artifact@v7
              with:
                  name: docs-markdown
                  path: docs-markdown
                  retention-days: 1

    # The docs are generated at build time: the docs-markdown branch holds them for the indexes that read a Git
    # repository (context7.json). Pushes made with GITHUB_TOKEN do not trigger other workflows.
    docs-markdown:
        needs: deploy
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: docs-markdown
                  path: ${{ runner.temp }}/docs-markdown

            - name: Push the docs-markdown branch
              run: |
                  if git fetch --depth=1 origin docs-markdown; then
                      git switch --create docs-markdown FETCH_HEAD
                  else
                      git switch --orphan docs-markdown
                  fi
                  git rm -rfq --ignore-unmatch .
                  cp -R "$RUNNER_TEMP/docs-markdown/." .
                  git add -A
                  if git diff --cached --quiet; then
                      echo "The Markdown docs did not change."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -q -m "docs: ${GITHUB_SHA::10}"
                  git push origin docs-markdown
