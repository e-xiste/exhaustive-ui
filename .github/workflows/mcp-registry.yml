name: MCP Registry

# Publishes packages/mcp/server.json to the official MCP registry (registry.modelcontextprotocol.io). Called by the
# Release workflow after npm; run it by hand to publish the version of the branch again after a failure.
on:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # The registry authenticates this workflow through GitHub's OIDC token, which grants the io.github.e-xiste
            # namespace. No secret is used.
            id-token: write
        env:
            MCP_PUBLISHER_VERSION: v1.8.16

        steps:
            - uses: actions/checkout@v7

            # The registry checks the mcpName of the version published on npm, which can take a few minutes to appear.
            - name: Wait for the version on npm
              run: |
                  name=$(jq -r '.packages[0].identifier' packages/mcp/server.json)
                  version=$(jq -r '.packages[0].version' packages/mcp/server.json)
                  for attempt in $(seq 1 40); do
                      if [ "$(npm view "$name@$version" mcpName --prefer-online 2>/dev/null)" = "$(jq -r .name packages/mcp/server.json)" ]; then
                          echo "$name@$version is on npm."
                          exit 0
                      fi
                      sleep 15
                  done
                  echo "::error::$name@$version is not on npm, or does not declare the mcpName of server.json."
                  exit 1

            - name: Install cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            - name: Download and verify mcp-publisher
              run: |
                  set -euo pipefail
                  archive=mcp-publisher_linux_amd64.tar.gz
                  base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
                  cd "$RUNNER_TEMP"
                  curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
                  curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
                  cosign verify-blob \
                      --bundle "$archive.sigstore.json" \
                      --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
                      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                      "$archive"
                  tar xzf "$archive" mcp-publisher

            - name: Publish to the MCP registry
              working-directory: packages/mcp
              run: |
                  "$RUNNER_TEMP/mcp-publisher" login github-oidc
                  "$RUNNER_TEMP/mcp-publisher" publish
