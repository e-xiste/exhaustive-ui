packages:
  - 'packages/*'
  - 'apps/*'
  - 'apps/tailwind-playgrounds/*'

shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true

catalog:
  '@openng/icons': ^1.0.0

catalogs:
  angular22:
    "@angular-devkit/build-angular": ^22.1.6
    "@angular/animations": ^22.2.1
    "@angular/build": ^22.1.6
    "@angular/cdk": ^22.1.4
    "@angular/cli": ^22.1.6
    "@angular/common": ^22.2.1
    "@angular/compiler": ^22.2.1
    "@angular/compiler-cli": ^22.2.1
    "@angular/core": ^22.2.1
    "@angular/forms": ^22.2.1
    "@angular/platform-browser": ^22.2.1
    "@angular/platform-browser-dynamic": ^22.2.1
    "@angular/platform-server": ^22.2.1
    "@angular/router": ^22.2.1
    "@angular/ssr": ^22.1.6
    "@angular-eslint/eslint-plugin": ^22.1.0
    "@angular-eslint/eslint-plugin-template": ^22.1.0
    "@angular-eslint/schematics": ^22.1.0
    "@angular-eslint/template-parser": ^22.1.0
    "ng-packagr": ^22.1.1
    "typescript": ^6.0.0

minimumReleaseAgeExclude:
  - pnpm@11.13.1
  - '@openng/icons@1.0.0'
  - tsdown@0.22.9
  - '@angular/animations@22.1.4'
  - '@angular/common@22.1.4'
  - '@angular/compiler-cli@22.1.4'
  - '@angular/compiler@22.1.4'
  - '@angular/core@22.1.4'
  - '@angular/forms@22.1.4'
  - '@angular/platform-browser-dynamic@22.1.4'
  - '@angular/platform-browser@22.1.4'
  - '@angular/platform-server@22.1.4'
  - '@angular/router@22.1.4'

overrides:
  # GHSA-mrhx-c7xc-m3w5 (high): pulled in by @angular/forms, which declares zod ^4.0.10.
  zod: ^4.6.6
  # GHSA (high) host confusion in fast-uri <3.1.7: pulled in by @modelcontextprotocol/sdk through ajv.
  fast-uri: ^3.1.7
  # Advisories (high/critical) in the HTTP transport dependencies of @modelcontextprotocol/sdk;
  # @exhaustive-ui/mcp only uses the stdio transport, but pnpm audit --prod still flags them.
  hono: ^4.12.25
  ip-address: ^10.3.1
  proxy-addr: ^2.0.8
  body-parser@>=2.0.0: ^2.4.0
