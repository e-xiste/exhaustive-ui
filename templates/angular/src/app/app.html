<main>
  <h1>Tasks</h1>

  <form (ngSubmit)="add()">
    <input
      pInputText
      name="title"
      [(ngModel)]="title"
      placeholder="New task"
      aria-label="New task"
    />
    <p-button type="submit" label="Add" [disabled]="!title().trim()" />
    <p-select
      name="status"
      [options]="statuses"
      [(ngModel)]="status"
      [showClear]="true"
      placeholder="All statuses"
      ariaLabel="Filter by status"
    />
  </form>

  <p-table [value]="visibleTasks()" dataKey="id">
    <ng-template #header>
      <tr>
        <th pSortableColumn="title">Title <p-sort-icon field="title" /></th>
        <th pSortableColumn="status">Status <p-sort-icon field="status" /></th>
      </tr>
    </ng-template>
    <ng-template #body let-task>
      <tr>
        <td>{{ task.title }}</td>
        <td><p-tag [value]="task.status" [severity]="severity(task.status)" /></td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="2">No task with this status.</td>
      </tr>
    </ng-template>
  </p-table>
</main>

<p-toast />
