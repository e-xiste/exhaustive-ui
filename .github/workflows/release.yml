name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: npm dist-tag (latest, next, beta, rc)
                required: true
                default: next
            extra_tags:
                description: additional dist-tags to point at the published version, space separated (e.g. "next")
                required: false
                default: ''

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm

        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Build
              env:
                  NODE_ENV: production
              run: |
                  pnpm run build:packages

            # Trusted publishing: npm authenticates this workflow through GitHub's OIDC token (id-token: write),
            # configured per package on npmjs.com (release.yml, environment npm). No npm token is used here.
            - name: Publish @exhaustive-ui/* to npm
              run: |
                  pnpm recursive publish --filter './packages/*' --no-git-checks --report-summary --tag ${{ inputs.tag }}

            # dist-tags are not covered by the trusted publisher permissions: this step uses the NPM_TOKEN secret.
            - name: Add extra dist-tags
              if: ${{ inputs.extra_tags != '' }}
              env:
                  EXTRA_TAGS: ${{ inputs.extra_tags }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
                  for dir in packages/*/; do
                      name=$(node -p "require('./${dir}package.json').name")
                      version=$(node -p "require('./${dir}package.json').version")
                      for tag in $EXTRA_TAGS; do
                          npm dist-tag add "$name@$version" "$tag"
                      done
                  done

    mcp-registry:
        needs: publish
        if: ${{ inputs.tag == 'latest' }}
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/mcp-registry.yml
